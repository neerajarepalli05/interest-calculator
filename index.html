<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
        <div class="bg-blue-600 px-6 py-4">
            <h2 class="text-xl font-bold text-white text-center">Interest Calculator</h2>
        </div>

        <div class="p-6">
            <form id="calculatorForm" class="space-y-4">
                
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Principal Amount</label>
                    <input type="number" id="amount" required min="0" step="any"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="e.g. 10000">
                </div>

                <div>
                    <label for="rate" class="block text-sm font-medium text-gray-700 mb-1">Interest Rate (per 100 per month)</label>
                    <input type="number" id="rate" required min="0" step="any"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                        placeholder="e.g. 2">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                        <input type="date" id="startDate" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                        <input type="date" id="endDate" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div id="errorMsg" class="hidden text-red-500 text-sm text-center font-medium"></div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-md transition-colors duration-200">
                    Calculate
                </button>
            </form>

            <!-- Results Section -->
            <div id="results" class="hidden mt-6 pt-6 border-t border-gray-200 space-y-3">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-md border border-gray-100">
                    <span class="text-sm text-gray-600 font-medium">Duration:</span>
                    <span id="resDuration" class="text-sm font-bold text-gray-800"></span>
                </div>
                
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-md border border-gray-100">
                    <span class="text-sm text-gray-600 font-medium">Total Interest:</span>
                    <span id="resInterest" class="text-lg font-bold text-blue-600"></span>
                </div>

                <div class="flex justify-between items-center bg-blue-50 p-4 rounded-md border border-blue-100 shadow-inner">
                    <span class="text-sm text-blue-800 font-semibold">Total Amount:</span>
                    <span id="resTotal" class="text-xl font-black text-blue-700"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('calculatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const errorMsg = document.getElementById('errorMsg');
            const resultsDiv = document.getElementById('results');
            
            errorMsg.classList.add('hidden');
            resultsDiv.classList.add('hidden');

            const amount = parseFloat(document.getElementById('amount').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;

            if (!startDateInput || !endDateInput) return;

            const d1 = new Date(startDateInput);
            const d2 = new Date(endDateInput);

            if (d2 < d1) {
                errorMsg.textContent = "End Date cannot be before Start Date.";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Calculate exact months and remaining days
            let months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
            let days = d2.getDate() - d1.getDate();

            // Adjust if days are negative (borrow a month)
            if (days < 0) {
                months--;
                // Get days in the previous month relative to the end date
                const previousMonth = new Date(d2.getFullYear(), d2.getMonth(), 0);
                days += previousMonth.getDate();
            }

            // Execute the exact calculation logic provided
            const monthlyInterest = (amount / 100) * rate;
            const totalInterest = (monthlyInterest * months) + ((monthlyInterest / 30) * days);
            const totalAmount = amount + totalInterest;

            // Display Results
            document.getElementById('resDuration').textContent = `${months} months, ${days} days`;
            // Formatting numbers to 2 decimal places for clean display
            document.getElementById('resInterest').textContent = totalInterest.toFixed(2);
            document.getElementById('resTotal').textContent = totalAmount.toFixed(2);

            resultsDiv.classList.remove('hidden');
        });
    </script>
</body>
</html>
